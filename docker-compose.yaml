version: '3.8'

services:
  cart_db:
    image: postgres:15-alpine
    container_name: cart_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cart_db
    ports:
      - "5432:5432"
    volumes:
      - pg_cart_data:/var/lib/postgresql/data
    restart: unless-stopped

  cart_app:
    build: .
    container_name: cart_app
    ports:
      - "3000:3000"
    depends_on:
      - cart_db
    environment:
      - DB_HOST=cart_db
    restart: unless-stopped

volumes:
  pg_cart_data:
